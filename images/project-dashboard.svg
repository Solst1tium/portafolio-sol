    <!-- Barras del chart -->
    <rect x="42" y="152" width="16" height="25" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="68" y="145" width="16" height="32" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="94" y="138" width="16" height="39" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="120" y="142" width="16" height="35" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <rect x="146" y="134" width="16" height="43" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <rect x="172" y="136" width="16" height="41" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <rect x="198" y="130" width="16" height="47" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="224" y="136" width="16" height="41" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="250" y="142" width="16" height="35" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <rect x="276" y="138" width="16" height="39" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="302" y="145" width="16" height="32" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="328" y="152" width="16" height="25" rx="3" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Eje X (meses) -->
    <text x="50" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Ene</text>
    <text x="76" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Feb</text>
    <text x="102" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Mar</text>
    <text x="128" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Abr</text>
    <text x="154" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">May</text>
    <text x="180" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Jun</text>
    <text x="206" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Jul</text>
    <text x="232" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Ago</text>
    <text x="258" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Sep</text>
    <text x="284" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Oct</text>
    <text x="310" y="186" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle">Nov</text>
