    <rect x="215" y="38" width="170" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="231" y="56" font-family="Arial" font-size="10" fill="#64748b">Ventas</text>
    <text x="231" y="78" font-family="Arial" font-size="20" font-weight="bold" fill="#f1f5f9">$45.2K</text>
    <rect x="231" y="84" width="144" height="2" rx="1" fill="#334155"/>
    <rect x="231" y="84" width="70" height="2" rx="1" fill="#3b82f6"/>
    
    <!-- Card 3 -->
    <rect x="400" y="38" width="170" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
