<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bg1)"/>
  
  <!-- === CONTENEDOR PRINCIPAL (centrado verticalmente) === -->
  <g transform="translate(0, 80)">
    
    <!-- === HEADER === -->
    <rect x="30" y="0" width="540" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <circle cx="44" cy="14" r="4" fill="#ef4444" opacity="0.6"/>
    <circle cx="58" cy="14" r="4" fill="#eab308" opacity="0.6"/>
    <circle cx="72" cy="14" r="4" fill="#22c55e" opacity="0.6"/>
    <text x="300" y="19" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">Dashboard Angular</text>
    
    <!-- === STATS CARDS === -->
