    <rect x="30" y="38" width="170" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="46" y="56" font-family="Arial" font-size="10" fill="#64748b">Usuarios</text>
    <text x="46" y="78" font-family="Arial" font-size="20" font-weight="bold" fill="#f1f5f9">1,284</text>
    <rect x="46" y="84" width="144" height="2" rx="1" fill="#334155"/>
    <rect x="46" y="84" width="100" height="2" rx="1" fill="#22c55e"/>
    
