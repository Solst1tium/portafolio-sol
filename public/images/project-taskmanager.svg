  <rect x="470" y="132" width="60" height="16" rx="8" fill="#ef4444" opacity="0.2"/>
  <text x="490" y="144" font-family="Arial" font-size="9" fill="#ef4444" text-anchor="middle">alta</text>
  
  <rect x="40" y="165" width="520" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="55" y="177" width="16" height="16" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="189" font-family="Arial" font-size="13" fill="#94a3b8" text-decoration="line-through">Configurar Pinia store</text>
  <rect x="470" y="177" width="60" height="16" rx="8" fill="#ef4444" opacity="0.2"/>
  <text x="490" y="189" font-family="Arial" font-size="9" fill="#ef4444" text-anchor="middle">alta</text>
  
  <rect x="40" y="210" width="520" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="55" y="222" width="16" height="16" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="234" font-family="Arial" font-size="13" fill="#f1f5f9">Crear componentes UI</text>
  <rect x="470" y="222" width="60" height="16" rx="8" fill="#eab308" opacity="0.2"/>
  <text x="490" y="234" font-family="Arial" font-size="9" fill="#eab308" text-anchor="middle">media</text>
  
  <rect x="40" y="255" width="520" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="55" y="267" width="16" height="16" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="279" font-family="Arial" font-size="13" fill="#f1f5f9">Implementar autenticación</text>
  <rect x="470" y="267" width="60" height="16" rx="8" fill="#ef4444" opacity="0.2"/>
  <text x="490" y="279" font-family="Arial" font-size="9" fill="#ef4444" text-anchor="middle">alta</text>
  
